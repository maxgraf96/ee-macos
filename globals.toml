# Curated symbols for Empire Earth's M1 modules, at their run-time addresses
# (game.toml base map: engine 0x10000000, sxlrt233 0x10200000, Default.dll
# 0x10300000). Every function the function DB names (exports, FID matches,
# community symbols) already carries that name in its listing; what is curated
# here is the M1 surface by a stable identifier: the random-map plugin API, the
# DllMains and the engine entry points the M1 harness drives. Sources:
# db/functions/*.json (exports) and db/community-symbols.json.
# tests/test_game_config.py checks every address against the DB.

# The kit's own code reads these three (Populous-shaped: turn counter, command
# frame, entity table). EE has no equivalent yet; sentinels in the unmapped
# arena between the executable and the heap.
[globals.simulation_turn]
addr = 0x00f00000
size = 4

[globals.command_frame]
addr = 0x00f00010
size = 4

[globals.entity_base]
addr = 0x00f01000
size = 4
stride = 4
count = 1

